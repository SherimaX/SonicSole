<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SonicSole | Jump Scoreboard</title>

  <style>
    :root {
      --primary: #8a0000;
      --primary-dark: #210000;
      --accent: #ffdada;
      --text: #2b2b2b;
      --light: #fff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--accent);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-top: 60px;
      animation: fadeIn 1.2s ease;
    }

    header h1 {
      font-size: 3em;
      color: var(--primary);
      margin-bottom: 0.3em;
    }

    .card {
      background-color: var(--light);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
      animation: slideUp 1s ease;
    }

    a.btn-outline {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1.1em;
      color: var(--primary);
      background-color: transparent;
      border: 2px solid var(--primary);
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
      text-decoration: none;
    }

    a.btn-outline:hover {
      background-color: var(--primary);
      color: var(--light);
      transform: translateY(-2px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--light);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
      animation: fadeIn 1.5s ease;
    }

    th, td {
      padding: 15px;
      font-size: 1.2em;
      text-align: center;
    }

    th {
      background-color: var(--primary-dark);
      color: var(--light);
      cursor: pointer;
      position: relative;
    }

    th.sorted {
      background-color: var(--primary);
    }

    tr:nth-child(even) {
      background-color: #ffe4e4;
    }

    td:first-child {
      font-weight: bold;
      color: var(--primary-dark);
    }

    .sort-indicator {
      margin-left: 10px;
      font-size: 0.9em;
      position: absolute;
      right: 12px;
    }

    .delete-form {
      margin: 0;
    }

    .delete-btn {
      padding: 8px 14px;
      font-size: 0.95em;
      color: var(--light);
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .delete-btn:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: auto;
      color: #555;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script>
    function sortTable(columnIndex, isNumeric = false) {
      var table = document.getElementById("leaderboard");
      var rows = Array.from(table.rows).slice(1);
      var isAscending = table.getAttribute("data-sort-asc") === "true";

      rows.sort(function (rowA, rowB) {
        var cellA = rowA.cells[columnIndex].innerText;
        var cellB = rowB.cells[columnIndex].innerText;

        if (isNumeric) {
          cellA = parseFloat(cellA) || 0;
          cellB = parseFloat(cellB) || 0;
        }

        if (isNumeric ? (cellA < cellB) : (cellA.toLowerCase() < cellB.toLowerCase()))
          return isAscending ? -1 : 1;
        if (isNumeric ? (cellA > cellB) : (cellA.toLowerCase() > cellB.toLowerCase()))
          return isAscending ? 1 : -1;

        return 0;
      });

      rows.forEach(row => table.tBodies[0].appendChild(row));
      table.setAttribute("data-sort-asc", !isAscending);
      updateSortIndicators(table, columnIndex, !isAscending);
    }

    function updateSortIndicators(table, columnIndex, isAscending) {
      var headers = table.querySelectorAll("th");
      headers.forEach((header, index) => {
        var indicator = header.querySelector(".sort-indicator");
        if (index === columnIndex) {
          if (indicator) {
            indicator.textContent = isAscending ? "↓" : "↑";
          }
          header.classList.add("sorted");
        } else {
          if (indicator) {
            indicator.textContent = "";
          }
          header.classList.remove("sorted");
        }
      });
    }
  </script>
</head>

<body>
  <header>
    <h1>SonicSole</h1>
  </header>

  <div class="card">
    <h2>Jumping Scoreboard</h2>
    <a href="/jump" class="btn-outline">Go Back</a>

    <table id="leaderboard">
      <tr>
        <th onclick="sortTable(0)">Name <span class="sort-indicator"></span></th>
        <th onclick="sortTable(1, true)">Jump Height (m) <span class="sort-indicator"></span></th>
        <th>Actions</th>
      </tr>
      {% for entry in data %}
      <tr>
        <td>{{ entry.name }}</td>
        <td>{{ entry.last_jump_height }}</td>
        <td>
          <form class="delete-form" action="/delete_score_entry" method="POST" onsubmit="return confirm({{ ('Delete all jump scores for ' ~ entry.name ~ '?') | tojson }});">
            <input type="hidden" name="scoreboard" value="jump" />
            <input type="hidden" name="name" value="{{ entry.name }}" />
            <button type="submit" class="delete-btn">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>

  <footer>
    <a href="/" class="btn-outline">Home</a>
  </footer>
</body>
</html>
