<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SonicSole | Reaction Time Scoreboard</title>
  <style>
    :root {
      --primary: #27e1ff;
      --primary-dark: #ff5c5c;
      --accent: #101318;
      --text: #eff6ff;
      --light: rgba(14, 19, 28, 0.92);
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(39, 225, 255, 0.14), transparent 18%),
        radial-gradient(circle at 80% 18%, rgba(255, 92, 92, 0.12), transparent 18%),
        linear-gradient(180deg, #0b1016 0%, #141c28 55%, #0c1118 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0 2px, transparent 2px 6px),
        linear-gradient(90deg, transparent 0 49%, rgba(39, 225, 255, 0.08) 49% 51%, transparent 51% 100%);
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-top: 60px;
      animation: fadeIn 1.2s ease;
    }

    header h1 {
      font-size: 3em;
      color: var(--text);
      margin-bottom: 0.3em;
      font-family: "Impact", "Arial Black", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(39, 225, 255, 0.32);
    }

    .card {
      background: linear-gradient(180deg, rgba(21, 27, 38, 0.94), rgba(11, 16, 24, 0.92));
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
      animation: slideUp 1s ease;
      border: 1px solid rgba(39, 225, 255, 0.22);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, #27e1ff, #f1ff6b, #ff5c5c);
    }

    a.btn-outline {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1.1em;
      color: var(--text);
      background-color: rgba(39, 225, 255, 0.06);
      border: 2px solid rgba(39, 225, 255, 0.34);
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
      text-decoration: none;
    }

    a.btn-outline:hover {
      background-color: rgba(39, 225, 255, 0.18);
      color: var(--text);
      transform: translateY(-2px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: rgba(7, 12, 18, 0.6);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
      animation: fadeIn 1.5s ease;
    }

    th, td {
      padding: 15px;
      font-size: 1.2em;
      text-align: center;
    }

    th {
      background-color: rgba(39, 225, 255, 0.14);
      color: var(--text);
      cursor: pointer;
      position: relative;
    }

    th.sorted {
      background-color: rgba(255, 92, 92, 0.28);
    }

    tr:nth-child(even) {
      background-color: rgba(39, 225, 255, 0.05);
    }

    td:first-child {
      font-weight: bold;
      color: var(--primary);
    }

    .sort-indicator {
      margin-left: 10px;
      font-size: 0.9em;
      position: absolute;
      right: 12px;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: auto;
      color: rgba(239, 246, 255, 0.75);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='playground-theme.css') }}">

  <script>
    function sortTable(columnIndex, isNumeric = false) {
      var table = document.getElementById("leaderboard");
      var rows = Array.from(table.rows).slice(1);
      var isAscending = table.getAttribute("data-sort-asc") === "true";

      rows.sort(function (rowA, rowB) {
        var cellA = rowA.cells[columnIndex].innerText;
        var cellB = rowB.cells[columnIndex].innerText;

        if (isNumeric) {
          cellA = parseFloat(cellA) || 0;
          cellB = parseFloat(cellB) || 0;
        }

        if (isNumeric ? (cellA < cellB) : (cellA.toLowerCase() < cellB.toLowerCase()))
          return isAscending ? -1 : 1;
        if (isNumeric ? (cellA > cellB) : (cellA.toLowerCase() > cellB.toLowerCase()))
          return isAscending ? 1 : -1;

        return 0;
      });

      rows.forEach(row => table.tBodies[0].appendChild(row));
      table.setAttribute("data-sort-asc", !isAscending);
      updateSortIndicators(table, columnIndex, !isAscending);
    }

    function updateSortIndicators(table, columnIndex, isAscending) {
      var headers = table.querySelectorAll("th");
      headers.forEach((header, index) => {
        var indicator = header.querySelector(".sort-indicator");
        if (index === columnIndex) {
          indicator.textContent = isAscending ? "↓" : "↑";
          header.classList.add("sorted");
        } else {
          indicator.textContent = "";
          header.classList.remove("sorted");
        }
      });
    }
  </script>
</head>

<body>
  <header>
    <h1>SonicSole</h1>
  </header>

  <div class="card">
    <h2>Reaction Time Scoreboard</h2>
    <a href="/reaction" class="btn-outline">Go Back</a>

    <table id="leaderboard">
      <tr>
        <th onclick="sortTable(0)">Name <span class="sort-indicator"></span></th>
        <th onclick="sortTable(1, true)">Reaction Time (ms) <span class="sort-indicator"></span></th>
      </tr>
      {% for entry in data %}
      <tr>
        <td>{{ entry.name }}</td>
        <td>{{ entry.reaction_time }}</td>
      </tr>
      {% endfor %}
    </table>
  </div>

  <footer>
    <a href="/" class="btn-outline">Home</a>
  </footer>
</body>
</html>
