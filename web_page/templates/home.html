<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SonicSole</title>
  <style>
    :root {
      --main-bg:
        radial-gradient(circle at 15% 15%, rgba(201, 139, 46, 0.22), transparent 20%),
        radial-gradient(circle at 85% 18%, rgba(122, 28, 28, 0.18), transparent 18%),
        radial-gradient(circle at 50% 110%, rgba(82, 44, 26, 0.12), transparent 28%),
        linear-gradient(135deg, #f7f1e8 0%, #efe1c9 52%, #f4ead9 100%);
      --accent: #7a1c1c;
      --accent-dark: #341010;
      --highlight: #c98b2e;
      --card-bg: rgba(255, 248, 238, 0.88);
      --text-dark: #2d261d;
      --text-subtle: #675748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      background: var(--main-bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        repeating-linear-gradient(90deg, rgba(122, 28, 28, 0.05) 0 1px, transparent 1px 120px),
        repeating-linear-gradient(0deg, rgba(122, 28, 28, 0.035) 0 1px, transparent 1px 120px);
      opacity: 0.55;
    }

    body::after {
      background:
        radial-gradient(circle at 8% 75%, rgba(122, 28, 28, 0.1), transparent 24%),
        radial-gradient(circle at 92% 72%, rgba(201, 139, 46, 0.14), transparent 20%);
    }

    header,
    .card-grid {
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 70px 20px 24px;
      max-width: 760px;
    }

    h1 {
      font-family: "Palatino Linotype", "Book Antiqua", serif;
      font-size: 4.4rem;
      color: var(--accent);
      margin-bottom: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 12px 24px rgba(82, 44, 26, 0.12);
    }

    .sub {
      font-size: 1.45rem;
      line-height: 1.5;
      margin-bottom: 30px;
      color: var(--text-subtle);
    }

    .setup-guide-fab {
      display: inline-block;
      position: fixed;
      left: 50%;
      bottom: 24px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 14px 28px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #a12727);
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 16px 28px rgba(122, 28, 28, 0.18);
      transform: translateX(-50%);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      z-index: 20;
    }

    .setup-guide-fab:hover {
      background: linear-gradient(135deg, #8d2222, var(--accent-dark));
      transform: translateX(-50%) translateY(-2px) scale(1.02);
      box-shadow: 0 20px 34px rgba(122, 28, 28, 0.22);
    }

    .hardware-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 54px;
      height: 54px;
      border: 1px solid rgba(52, 16, 16, 0.16);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #a12727);
      color: #fff;
      box-shadow: 0 22px 36px rgba(122, 28, 28, 0.24);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      z-index: 20;
    }

    .hardware-fab:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 26px 42px rgba(122, 28, 28, 0.3);
      background: linear-gradient(135deg, #8d2222, var(--accent-dark));
    }

    .hardware-fab__icon {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      overflow: visible;
    }

    .hardware-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(45, 38, 29, 0.4);
      backdrop-filter: blur(8px);
      z-index: 30;
    }

    .hardware-modal[hidden] {
      display: none;
    }

    .hardware-modal__dialog {
      position: relative;
      width: min(100%, 420px);
    }

    .hardware-monitor {
      padding: 22px 20px 18px;
      border-radius: 24px;
      background: rgba(255, 248, 238, 0.96);
      border: 1px solid rgba(52, 16, 16, 0.12);
      box-shadow: 0 22px 42px rgba(65, 43, 26, 0.2);
      backdrop-filter: blur(12px);
      text-align: left;
      max-height: min(78vh, 560px);
      overflow-y: auto;
    }

    .hardware-monitor__eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-subtle);
      margin-bottom: 6px;
    }

    .hardware-monitor__title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--accent-dark);
    }

    .hardware-monitor__summary {
      font-size: 0.92rem;
      line-height: 1.5;
      color: var(--text-subtle);
      margin-bottom: 16px;
    }

    .hardware-monitor__list {
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .hardware-monitor__item {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(52, 16, 16, 0.08);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .hardware-monitor__item.is-online {
      background: rgba(235, 248, 239, 0.92);
      border-color: rgba(43, 155, 83, 0.2);
    }

    .hardware-monitor__item.is-offline {
      background: rgba(255, 242, 242, 0.92);
      border-color: rgba(179, 65, 65, 0.16);
    }

    .hardware-monitor__item.is-unavailable {
      background: rgba(255, 247, 234, 0.96);
      border-color: rgba(201, 139, 46, 0.2);
    }

    .hardware-monitor__indicator {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #b44141;
      box-shadow: 0 0 0 4px rgba(179, 65, 65, 0.16);
    }

    .hardware-monitor__indicator.is-online {
      background: #2b9b53;
      box-shadow: 0 0 0 4px rgba(43, 155, 83, 0.18);
    }

    .hardware-monitor__indicator.is-unavailable {
      background: #c98b2e;
      box-shadow: 0 0 0 4px rgba(201, 139, 46, 0.16);
    }

    .hardware-monitor__copy {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .hardware-monitor__name {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .hardware-monitor__ip {
      font-size: 0.8rem;
      color: var(--text-subtle);
      letter-spacing: 0.02em;
    }

    .hardware-monitor__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .hardware-monitor__action {
      border: 1px solid rgba(52, 16, 16, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--accent-dark);
      font: inherit;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 7px 10px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .hardware-monitor__action:hover:not(:disabled) {
      background: rgba(255, 241, 231, 0.96);
      border-color: rgba(122, 28, 28, 0.2);
    }

    .hardware-monitor__action:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .hardware-monitor__state {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #b44141;
    }

    .hardware-monitor__state.is-online {
      color: #2b9b53;
    }

    .hardware-monitor__state.is-unavailable {
      color: #c98b2e;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      padding: 50px 30px 120px;
      width: 100%;
      max-width: 1200px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 36px rgba(65, 43, 26, 0.14);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 1px solid rgba(52, 16, 16, 0.12);
      backdrop-filter: blur(8px);
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 12px;
    }

    .card:nth-child(1)::before {
      background: linear-gradient(90deg, #ff7a00, #ffd166, #17324d);
    }

    .card:nth-child(2)::before {
      background: linear-gradient(90deg, #284b3e, #9bc1a3, #e8dfc8);
    }

    .card:nth-child(3)::before {
      background: linear-gradient(90deg, #27e1ff, #f1ff6b, #ff5c5c);
    }

    .card:nth-child(4)::before {
      background: linear-gradient(90deg, #8dc4cc, #d9e7ea, #22343a);
    }

    .card:nth-child(5)::before {
      background: linear-gradient(90deg, #57b65f, #d9ff6a, #30353b);
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 24px 42px rgba(65, 43, 26, 0.18);
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      filter: saturate(1.05) contrast(1.02);
    }

    .card-title {
      padding: 18px;
      font-size: 1.18rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-dark);
      background: rgba(255, 255, 255, 0.68);
      letter-spacing: 0.02em;
    }

    .card:nth-child(1) .card-title {
      background: linear-gradient(135deg, rgba(255, 215, 170, 0.92), rgba(255, 255, 255, 0.82));
    }

    .card:nth-child(2) .card-title {
      background: linear-gradient(135deg, rgba(224, 235, 214, 0.95), rgba(255, 252, 245, 0.84));
    }

    .card:nth-child(3) .card-title {
      color: #eef6ff;
      background: linear-gradient(135deg, rgba(16, 19, 24, 0.94), rgba(28, 39, 55, 0.92));
    }

    .card:nth-child(4) .card-title {
      background: linear-gradient(135deg, rgba(220, 240, 243, 0.95), rgba(245, 250, 250, 0.84));
    }

    .card:nth-child(5) .card-title {
      background: linear-gradient(135deg, rgba(223, 244, 212, 0.96), rgba(255, 255, 251, 0.84));
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 3rem;
      }
      .sub {
        font-size: 1.2rem;
      }
      .setup-guide-fab {
        font-size: 1rem;
        padding: 10px 20px;
        bottom: 18px;
      }
    }

    @media (max-width: 700px) {
      .hardware-fab {
        bottom: 18px;
        right: 18px;
        width: 46px;
        height: 46px;
      }

      .hardware-fab__icon {
        width: 22px;
        height: 22px;
      }

      .hardware-modal {
        padding: 16px;
      }
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='playground-theme.css') }}" data-live-css-src="{{ url_for('static', filename='playground-theme.css') }}">
  <script defer src="{{ url_for('static', filename='playground-live.css.js') }}"></script>
</head>
<body class="pg-home">

  <button
    class="hardware-fab"
    id="hardwareMonitorTrigger"

    aria-controls="hardwareMonitorModal"

      <path d="M1.9 12h3"></path>
      <path d="M1.9 16.7h3"></path>

      <path d="M19.1 12h3"></path>

  <div class="hardware-modal" id="hardwareMonitorModal" hidden>
    <div
      class="hardware-modal__dialog"
      id="hardwareMonitorDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="hardware-monitor-title"
      tabindex="-1"
    >
      <aside class="hardware-monitor">
        <p class="hardware-monitor__eyebrow">Hardware Monitor</p>
        <h2 class="hardware-monitor__title" id="hardware-monitor-title">Device Connectivity</h2>
        <p class="hardware-monitor__summary" id="hardwareMonitorSummary">Checking device reachability...</p>

        <ul class="hardware-monitor__list">
          {% for group in group_options %}
          <li class="hardware-monitor__item is-offline" data-device-id="{{ group.id }}">
            <span class="hardware-monitor__indicator is-offline" aria-hidden="true"></span>
            <div class="hardware-monitor__copy">
              <span class="hardware-monitor__name">{{ group.label }}</span>
              <span class="hardware-monitor__ip">{{ group.ip or "No device assigned" }}</span>
              <div class="hardware-monitor__actions">
                <button
                  type="button"
                  class="hardware-monitor__action"
                  data-assign-group-id="{{ group.id }}"
                  onclick="assignLiveDeviceToGroup('{{ group.id }}')"
                >
                  Assign Live Device
                </button>
              </div>
            </div>
            <span class="hardware-monitor__state is-offline"></span>
          </li>
          {% endfor %}
        </ul>
      </aside>
    </div>

  <script>
    const hardwareMonitorSummary = document.getElementById("hardwareMonitorSummary");
    const hardwareMonitorModal = document.getElementById("hardwareMonitorModal");
    const hardwareMonitorDialog = document.getElementById("hardwareMonitorDialog");
    const hardwareMonitorTrigger = document.getElementById("hardwareMonitorTrigger");
    const hardwareMonitorRows = new Map(
      Array.from(document.querySelectorAll("[data-device-id]")).map((row) => [
        row.dataset.deviceId,
        row,
      ])
    );

    function formatAgeLabel(seconds) {
      if (typeof seconds !== "number" || Number.isNaN(seconds)) {
        return "Checked just now.";
      }
      if (seconds < 1) {
        return "Checked just now.";
      }
      if (seconds < 60) {
        return `Checked ${Math.round(seconds)}s ago.`;
      }
      return `Checked ${Math.round(seconds / 60)}m ago.`;
    }

    function setHardwareRowState(row, statusVariant, stateLabel) {
      if (!row) return;

      row.classList.toggle("is-online", statusVariant === "online");
      row.classList.toggle("is-unavailable", statusVariant === "unavailable");
      row.classList.toggle(
        "is-offline",
        statusVariant !== "online" && statusVariant !== "unavailable"
      );

      const indicator = row.querySelector(".hardware-monitor__indicator");
      const state = row.querySelector(".hardware-monitor__state");

      if (indicator) {
        indicator.classList.toggle("is-online", statusVariant === "online");
        indicator.classList.toggle("is-unavailable", statusVariant === "unavailable");
        indicator.classList.toggle(
          "is-offline",
          statusVariant !== "online" && statusVariant !== "unavailable"
        );
      }

      if (state) {
        state.textContent = stateLabel || "";
        state.style.visibility = stateLabel ? "visible" : "hidden";
        state.classList.toggle("is-online", statusVariant === "online");
        state.classList.toggle("is-unavailable", statusVariant === "unavailable");
        state.classList.toggle(
          "is-offline",
          statusVariant !== "online" && statusVariant !== "unavailable"
        );
      }
    }

    function renderHardwareStatus(payload) {
      const devices = Array.isArray(payload.devices) ? payload.devices : [];
      const liveDevice = payload.live_device && payload.live_device.ip ? payload.live_device : null;
      const connectedCount = devices.filter((device) => device.connected).length;
      const assignedCount = devices.filter((device) => device.assigned).length;
      const unavailableCount = devices.filter((device) => device.probe_error).length;
      const latestAge = devices.length
        ? Math.max(
            ...devices.map((device) =>
              typeof device.checked_age_seconds === "number"
                ? device.checked_age_seconds
                : 0
            )
          )
        : 0;

      devices.forEach((device) => {
        const row = hardwareMonitorRows.get(device.id);
        const statusVariant = device.connected
          ? "online"
          : !device.assigned
            ? "offline"
            : device.probe_error
            ? "unavailable"
            : "offline";
        const stateLabel = device.connected
          ? "Live"
          : !device.assigned
            ? ""
            : device.probe_error
            ? "Unavailable"
            : "Offline";
        setHardwareRowState(row, statusVariant, stateLabel);
        const ipLabel = row ? row.querySelector(".hardware-monitor__ip") : null;
        const assignButton = row ? row.querySelector("[data-assign-group-id]") : null;
        if (ipLabel) {
          ipLabel.textContent = device.ip || "No device assigned";
        }
        if (assignButton) {
          assignButton.disabled = !liveDevice;
          assignButton.textContent = device.assigned ? "Assigned" : "Unassigned";
        }
      });

      if (!devices.length) {
        hardwareMonitorSummary.textContent = "No hardware devices are configured yet.";
        return;
      }

      if (liveDevice) {
        hardwareMonitorSummary.textContent =
          assignedCount > 0
            ? `Live device ${liveDevice.ip} detected. Assign or reassign it to a group below. ${connectedCount} of ${devices.length} groups are currently live. ${formatAgeLabel(latestAge)}`
            : `Live device ${liveDevice.ip} detected. Choose a group below to assign it. ${formatAgeLabel(latestAge)}`;
        return;
      }

      if (assignedCount === 0) {
        hardwareMonitorSummary.textContent =
          "Waiting for a SonicSole device to start streaming. Once detected, you can assign it to a group here.";
        return;
      }

      if (unavailableCount === devices.length) {
        hardwareMonitorSummary.textContent =
          "Connectivity checks are unavailable on this host right now.";
        return;
      }

      hardwareMonitorSummary.textContent =
        unavailableCount > 0
          ? `${connectedCount} of ${devices.length} assigned groups are live. ${unavailableCount} checks unavailable. ${formatAgeLabel(latestAge)}`
          : `${connectedCount} of ${devices.length} assigned groups are live. ${formatAgeLabel(latestAge)}`;
    }

    async function refreshHardwareStatus() {
      try {
        const response = await fetch("/hardware_status", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`hardware_status returned ${response.status}`);
        }

        const payload = await response.json();
        renderHardwareStatus(payload);
      } catch (error) {
        hardwareMonitorRows.forEach((row) => {
          setHardwareRowState(row, "offline", "Offline");
        });
        hardwareMonitorSummary.textContent = "Unable to check device connectivity right now.";
      }
    }

    async function postHardwareAssignment(url, groupId) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ group_id: groupId }),
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || "Unable to update the device assignment.");
      }
      return data;
    }

    async function assignLiveDeviceToGroup(groupId) {
      try {
        await postHardwareAssignment("{{ url_for('assign_group_device') }}", groupId);
        await refreshHardwareStatus();
      } catch (error) {
        alert(error.message);
      }
    }

    function openHardwareModal() {
      hardwareMonitorModal.hidden = false;
      hardwareMonitorTrigger.setAttribute("aria-expanded", "true");
      refreshHardwareStatus();
      hardwareMonitorDialog.focus();
    }

    function closeHardwareModal() {
      hardwareMonitorModal.hidden = true;
      hardwareMonitorTrigger.setAttribute("aria-expanded", "false");
      hardwareMonitorTrigger.focus();
    }

    hardwareMonitorTrigger.addEventListener("click", openHardwareModal);

    hardwareMonitorModal.addEventListener("click", (event) => {
      if (event.target === hardwareMonitorModal) {
        closeHardwareModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !hardwareMonitorModal.hidden) {
        closeHardwareModal();
      }
    });

    refreshHardwareStatus();
    window.setInterval(refreshHardwareStatus, 5000);
  </script>

</body>
</html>
