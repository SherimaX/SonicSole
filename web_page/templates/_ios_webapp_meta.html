<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="{{ webapp_status_bar_style | default('default') }}" />
<meta name="apple-mobile-web-app-title" content="{{ webapp_title | default('SonicSole') }}" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="{{ webapp_theme_color | default('#f5f5f0') }}" />
<link rel="apple-touch-icon" href="{{ url_for('static', filename='sonicsole-app-icon.png') }}" />
<link rel="icon" type="image/png" href="{{ url_for('static', filename='sonicsole-app-icon.png') }}" />
