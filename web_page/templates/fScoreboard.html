<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SonicSole | Force Sensitivity Scoreboard</title>
  <style>
    :root {
      --primary: #ff8b28;
      --primary-dark: #8e4310;
      --accent: #161c24;
      --text: #eef2f5;
      --light: rgba(32, 36, 44, 0.92);
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 139, 40, 0.18), transparent 18%),
        linear-gradient(180deg, #13181f 0%, #20242c 60%, #12161d 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(174, 184, 198, 0.08) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(90deg, rgba(174, 184, 198, 0.08) 0 1px, transparent 1px 44px);
      opacity: 0.4;
      pointer-events: none;
    }

    header {
      text-align: center;
      margin-top: 60px;
      animation: fadeIn 1.5s ease;
    }

    header h1 {
      font-size: 3em;
      color: var(--text);
      margin-bottom: 0.2em;
      font-family: "Arial Black", "Impact", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card {
      background-color: var(--light);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 24px 46px rgba(0, 0, 0, 0.34);
      width: 90%;
      max-width: 800px;
      margin: 50px auto;
      text-align: center;
      animation: slideUp 1s ease;
      border: 1px solid rgba(174, 184, 198, 0.14);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 16px;
      background: repeating-linear-gradient(90deg, #ff8b28 0 42px, #aeb8c6 42px 84px, #20242c 84px 126px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 15px;
      text-align: center;
      font-size: 1.1em;
    }

    th {
      background-color: var(--primary);
      color: #10161e;
      cursor: pointer;
      position: relative;
    }

    td {
      background-color: rgba(14, 18, 24, 0.62);
      color: var(--text);
    }

    tr:nth-child(even) td {
      background-color: rgba(174, 184, 198, 0.08);
    }

    th.sorted {
      background-color: var(--primary-dark);
    }

    .sort-indicator {
      margin-left: 8px;
      font-size: 0.8em;
      opacity: 0.8;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1.1em;
      color: #10161e;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: rgba(174, 184, 198, 0.06);
      color: var(--text);
      border: 2px solid rgba(174, 184, 198, 0.3);
    }

    .btn-outline:hover {
      background-color: var(--primary);
      color: #111820;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: rgba(238, 242, 245, 0.78);
      margin-top: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='playground-theme.css') }}">
  <script>
    function sortTable(columnIndex, isNumeric = false) {
      var table = document.getElementById("leaderboard");
      var rows = Array.from(table.rows).slice(1);
      var isAscending = table.getAttribute("data-sort-asc") === "true";

      rows.sort(function (rowA, rowB) {
        var cellA = rowA.cells[columnIndex].innerText;
        var cellB = rowB.cells[columnIndex].innerText;

        if (isNumeric) {
          cellA = parseFloat(cellA) || 0;
          cellB = parseFloat(cellB) || 0;
        }

        if (isNumeric ? (cellA < cellB) : (cellA.toLowerCase() < cellB.toLowerCase()))
          return isAscending ? -1 : 1;
        if (isNumeric ? (cellA > cellB) : (cellA.toLowerCase() > cellB.toLowerCase()))
          return isAscending ? 1 : -1;

        return 0;
      });

      rows.forEach(row => table.tBodies[0].appendChild(row));
      table.setAttribute("data-sort-asc", !isAscending);
      updateSortIndicators(table, columnIndex, !isAscending);
    }

    function updateSortIndicators(table, columnIndex, isAscending) {
      var headers = table.querySelectorAll("th");
      headers.forEach(function (header, index) {
        var indicator = header.querySelector(".sort-indicator");
        if (index === columnIndex) {
          indicator.textContent = isAscending ? "↓" : "↑";
          header.classList.add("sorted");
        } else {
          indicator.textContent = "";
          header.classList.remove("sorted");
        }
      });
    }
  </script>
</head>
<body>
  <header>
    <h1>SonicSole</h1>
    <p style="color: var(--primary-dark); font-size: 1.2em;">Force Sensitivity Scoreboard</p>
  </header>

  <div class="card">
    <table id="leaderboard">
      <tr>
        <th onclick="sortTable(0)" class="sortable">Name <span class="sort-indicator"></span></th>
        <th onclick="sortTable(1, true)" class="sortable">Percent Error <span class="sort-indicator"></span></th>
      </tr>
      {% for entry in data %}
      <tr>
        <td>{{ entry.name }}</td>
        <td>{{ entry.percent_error }}</td>
      </tr>
      {% endfor %}
    </table>

    <div style="margin-top: 30px;">
      <a href="/forceSensitivity" class="btn">Go Back</a>
      <a href="/" class="btn">Home</a>
    </div>
  </div>

</body>
</html>
