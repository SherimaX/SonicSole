<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SonicSole | Force Sensitivity Scoreboard</title>
  <style>
    :root {
      --primary: #8a0000;
      --primary-dark: #210000;
      --accent: #ffdada;
      --text: #2b2b2b;
      --light: #fff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--accent);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-top: 60px;
      animation: fadeIn 1.5s ease;
    }

    header h1 {
      font-size: 3em;
      color: var(--primary);
      margin-bottom: 0.2em;
    }

    .card {
      background-color: var(--light);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 800px;
      margin: 50px auto;
      text-align: center;
      animation: slideUp 1s ease;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 15px;
      text-align: center;
      font-size: 1.1em;
    }

    th {
      background-color: var(--primary);
      color: var(--light);
      cursor: pointer;
      position: relative;
    }

    td {
      background-color: var(--light);
      color: var(--text);
    }

    tr:nth-child(even) td {
      background-color: #fff2f2;
    }

    th.sorted {
      background-color: var(--primary-dark);
    }

    .sort-indicator {
      margin-left: 8px;
      font-size: 0.8em;
      opacity: 0.8;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1.1em;
      color: var(--light);
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-outline:hover {
      background-color: var(--primary);
      color: var(--light);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #555;
      margin-top: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script>
    function sortTable(columnIndex, isNumeric = false) {
      var table = document.getElementById("leaderboard");
      var rows = Array.from(table.rows).slice(1);
      var isAscending = table.getAttribute("data-sort-asc") === "true";

      rows.sort(function (rowA, rowB) {
        var cellA = rowA.cells[columnIndex].innerText;
        var cellB = rowB.cells[columnIndex].innerText;

        if (isNumeric) {
          cellA = parseFloat(cellA) || 0;
          cellB = parseFloat(cellB) || 0;
        }

        if (isNumeric ? (cellA < cellB) : (cellA.toLowerCase() < cellB.toLowerCase()))
          return isAscending ? -1 : 1;
        if (isNumeric ? (cellA > cellB) : (cellA.toLowerCase() > cellB.toLowerCase()))
          return isAscending ? 1 : -1;

        return 0;
      });

      rows.forEach(row => table.tBodies[0].appendChild(row));
      table.setAttribute("data-sort-asc", !isAscending);
      updateSortIndicators(table, columnIndex, !isAscending);
    }

    function updateSortIndicators(table, columnIndex, isAscending) {
      var headers = table.querySelectorAll("th");
      headers.forEach(function (header, index) {
        var indicator = header.querySelector(".sort-indicator");
        if (index === columnIndex) {
          indicator.textContent = isAscending ? "↓" : "↑";
          header.classList.add("sorted");
        } else {
          indicator.textContent = "";
          header.classList.remove("sorted");
        }
      });
    }
  </script>
</head>
<body>
  <header>
    <h1>SonicSole</h1>
    <p style="color: var(--primary-dark); font-size: 1.2em;">Force Sensitivity Scoreboard</p>
  </header>

  <div class="card">
    <table id="leaderboard">
      <tr>
        <th onclick="sortTable(0)" class="sortable">Name <span class="sort-indicator"></span></th>
        <th onclick="sortTable(1, true)" class="sortable">Percent Error <span class="sort-indicator"></span></th>
      </tr>
      {% for entry in data %}
      <tr>
        <td>{{ entry.name }}</td>
        <td>{{ entry.percent_error }}</td>
      </tr>
      {% endfor %}
    </table>

    <div style="margin-top: 30px;">
      <a href="/forceSensitivity" class="btn">Go Back</a>
      <a href="/" class="btn">Home</a>
    </div>
  </div>

</body>
</html>
