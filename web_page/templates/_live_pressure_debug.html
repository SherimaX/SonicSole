<style>
  .pg-pressure-debug {
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.05);
    font-family: "Menlo", "Consolas", monospace;
    font-size: 0.9em;
    color: rgba(36, 50, 44, 0.72);
    text-align: center;
    letter-spacing: 0.02em;
  }
  .pg-pressure-debug__label {
    opacity: 0.7;
    text-transform: uppercase;
    font-size: 0.75em;
    letter-spacing: 0.12em;
    margin-right: 6px;
  }
  .pg-pressure-debug__value {
    font-weight: 700;
    color: rgba(36, 50, 44, 0.92);
    display: inline-block;
    min-width: 4ch;
    text-align: right;
  }
  .pg-pressure-debug__sep {
    margin: 0 10px;
    opacity: 0.4;
  }
</style>
<div class="pg-pressure-debug" id="livePressureDebug" aria-live="off">
  <span class="pg-pressure-debug__label">debug</span>
  heel: <span class="pg-pressure-debug__value" id="liveHeel">--</span>
  <span class="pg-pressure-debug__sep">|</span>
  fore: <span class="pg-pressure-debug__value" id="liveFore">--</span>
</div>
<script>
  (function () {
    function renderValue(elementId, value) {
      var element = document.getElementById(elementId);
      if (!element) {
        return;
      }
      element.innerText = (value === null || value === undefined) ? "--" : value;
    }

    function pollLivePressure() {
      var url = (typeof window.withGroupQuery === "function")
        ? window.withGroupQuery("/live_pressure")
        : "/live_pressure";
      fetch(url)
        .then(function (response) { return response.json(); })
        .then(function (data) {
          renderValue("liveHeel", data.heel_pressure);
          renderValue("liveFore", data.fore_pressure);
        })
        .catch(function () { /* ignore transient network errors */ });
    }

    document.addEventListener("DOMContentLoaded", function () {
      pollLivePressure();
      setInterval(pollLivePressure, 200);
    });
  })();
</script>
