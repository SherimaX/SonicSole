<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Accel Plot</title>
  <style>
    :root {
      --bg: #08131b;
      --panel: rgba(12, 27, 36, 0.92);
      --line: rgba(99, 202, 255, 0.14);
      --text: #dff6ff;
      --muted: #8db3c1;
      --accent-a: #ff7a59;
      --accent-b: #58d68d;
      --accent-c: #4aa3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 122, 89, 0.12), transparent 16%),
        radial-gradient(circle at 82% 18%, rgba(74, 163, 255, 0.14), transparent 18%),
        linear-gradient(180deg, #071018 0%, #0d1e28 100%);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 54px),
        repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 54px);
      pointer-events: none;
    }

    .panel {
      width: min(920px, 92vw);
      padding: 28px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid rgba(223, 246, 255, 0.08);
      box-shadow: 0 24px 44px rgba(0, 0, 0, 0.32);
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .chart-shell {
      padding: 18px;
      border-radius: 18px;
      background: rgba(5, 13, 18, 0.64);
      border: 1px solid rgba(223, 246, 255, 0.06);
    }

    canvas {
      width: 100% !important;
      height: 360px !important;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='playground-theme.css') }}" data-live-css-src="{{ url_for('static', filename='playground-theme.css') }}">
  <script defer src="{{ url_for('static', filename='playground-live.css.js') }}"></script>
</head>
<body>
  <main class="panel">
    <h1>Live Acceleration Feed</h1>
    <p>Oscilloscope view of the SonicSole accelerometer stream.</p>
    <div class="chart-shell">
      <canvas id="chart" width="600" height="250"></canvas>
    </div>
  </main>
  <script>
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");
    const sampleCount = 100;
    const series = [
      { label: "ax", color: "#ff7a59", values: [] },
      { label: "ay", color: "#58d68d", values: [] },
      { label: "az", color: "#4aa3ff", values: [] }
    ];

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      const nextWidth = Math.max(Math.round(rect.width * ratio), 1);
      const nextHeight = Math.max(Math.round(rect.height * ratio), 1);

      if (canvas.width !== nextWidth || canvas.height !== nextHeight) {
        canvas.width = nextWidth;
        canvas.height = nextHeight;
      }

      drawChart();
    }

    function getScaleLimit() {
      let maxMagnitude = 0;
      for (const { values } of series) {
        for (const value of values) {
          maxMagnitude = Math.max(maxMagnitude, Math.abs(Number(value) || 0));
        }
      }
      return Math.max(1, Math.ceil(maxMagnitude * 1.2));
    }

    function drawFrame(bounds, scaleLimit) {
      const { left, top, width, height, bottom, ratio } = bounds;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(141,179,193,0.18)";
      ctx.lineWidth = 1;
      ctx.font = `${12 * ratio}px Trebuchet MS`;
      ctx.fillStyle = "#8db3c1";

      for (let index = 0; index <= 4; index += 1) {
        const y = top + (height / 4) * index;
        const value = ((2 - index) / 2) * scaleLimit;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(left + width, y);
        ctx.stroke();
        ctx.fillText(value.toFixed(1), 10 * ratio, y + (4 * ratio));
      }

      ctx.strokeStyle = "rgba(223,246,255,0.32)";
      ctx.beginPath();
      ctx.moveTo(left, bottom - (height / 2));
      ctx.lineTo(left + width, bottom - (height / 2));
      ctx.stroke();
    }

    function drawLegend(ratio) {
      let offsetX = 22 * ratio;
      const offsetY = 22 * ratio;

      ctx.font = `${12 * ratio}px Trebuchet MS`;
      ctx.textBaseline = "middle";
      for (const { label, color } of series) {
        ctx.fillStyle = color;
        ctx.fillRect(offsetX, offsetY - (5 * ratio), 14 * ratio, 10 * ratio);
        offsetX += 20 * ratio;
        ctx.fillStyle = "#dff6ff";
        ctx.fillText(label, offsetX, offsetY);
        offsetX += 34 * ratio;
      }
    }

    function drawSeries(bounds, scaleLimit) {
      const { left, top, width, height } = bounds;
      const maxIndex = Math.max(sampleCount - 1, 1);

      for (const { values, color } of series) {
        if (!values.length) continue;

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

        values.forEach((value, index) => {
          const x = left + (width * index) / maxIndex;
          const y = top + ((scaleLimit - value) / (scaleLimit * 2)) * height;

          if (index === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });

        ctx.stroke();
      }
    }

    function drawChart() {
      if (!canvas.width || !canvas.height) return;

      const ratio = canvas.width / Math.max(canvas.clientWidth || 1, 1);
      const bounds = {
        left: 42 * ratio,
        top: 34 * ratio,
        width: canvas.width - (62 * ratio),
        height: canvas.height - (62 * ratio),
        bottom: canvas.height - (28 * ratio),
        ratio
      };
      const scaleLimit = getScaleLimit();

      drawFrame(bounds, scaleLimit);
      drawSeries(bounds, scaleLimit);
      drawLegend(ratio);
    }

    async function poll() {
      try {
        const response = await fetch("/accel", { cache: "no-store" });
        if (!response.ok) return;

        const data = await response.json();
        series[0].values.push(Number(data.ax) || 0);
        series[1].values.push(Number(data.ay) || 0);
        series[2].values.push(Number(data.az) || 0);

        for (const entry of series) {
          if (entry.values.length > sampleCount) {
            entry.values.shift();
          }
        }

        drawChart();
      } catch (error) {
        // Ignore transient polling failures and keep the last frame visible.
      }
    }

    if (window.ResizeObserver) {
      new ResizeObserver(resizeCanvas).observe(canvas);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    poll();
    setInterval(poll, 50);
  </script>
</body>
</html>
