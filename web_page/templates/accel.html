<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Accel Plot</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #08131b;
      --panel: rgba(12, 27, 36, 0.92);
      --line: rgba(99, 202, 255, 0.14);
      --text: #dff6ff;
      --muted: #8db3c1;
      --accent-a: #ff7a59;
      --accent-b: #58d68d;
      --accent-c: #4aa3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 122, 89, 0.12), transparent 16%),
        radial-gradient(circle at 82% 18%, rgba(74, 163, 255, 0.14), transparent 18%),
        linear-gradient(180deg, #071018 0%, #0d1e28 100%);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 54px),
        repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 54px);
      pointer-events: none;
    }

    .panel {
      width: min(920px, 92vw);
      padding: 28px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid rgba(223, 246, 255, 0.08);
      box-shadow: 0 24px 44px rgba(0, 0, 0, 0.32);
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .chart-shell {
      padding: 18px;
      border-radius: 18px;
      background: rgba(5, 13, 18, 0.64);
      border: 1px solid rgba(223, 246, 255, 0.06);
    }

    canvas {
      width: 100% !important;
      height: 360px !important;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='playground-theme.css') }}">
</head>
<body>
  <main class="panel">
    <h1>Live Acceleration Feed</h1>
    <p>Oscilloscope view of the SonicSole accelerometer stream.</p>
    <div class="chart-shell">
      <canvas id="chart" width="600" height="250"></canvas>
    </div>
  </main>
  <script>
    const ctx = document.getElementById('chart').getContext('2d');
    const N = 100, labels = Array(N).fill(""), ax=[], ay=[], az=[];
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {label:"ax", data:ax, borderColor:"#ff7a59", fill:false, tension:0.25},
          {label:"ay", data:ay, borderColor:"#58d68d", fill:false, tension:0.25},
          {label:"az", data:az, borderColor:"#4aa3ff", fill:false, tension:0.25}
        ]
      },
      options: {
        animation:false,
        plugins: {
          legend: {
            labels: {
              color: "#dff6ff"
            }
          }
        },
        scales:{
          x:{display:false, grid:{display:false}},
          y:{
            ticks:{color:"#8db3c1"},
            grid:{color:"rgba(141,179,193,0.18)"}
          }
        }
      }
    });

    async function poll(){
      const r = await fetch('/accel'); const d = await r.json();
      ax.push(d.ax); ay.push(d.ay); az.push(d.az);
      if(ax.length>N){ax.shift(); ay.shift(); az.shift();}
      chart.update();
    }
    setInterval(poll, 50); // poll every 50ms
  </script>
</body>
</html>
